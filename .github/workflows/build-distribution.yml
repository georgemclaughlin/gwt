name: Build distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --target "${{ matrix.target }}"
      - name: Fetch locked dependencies for offline qualification
        run: cargo +1.96.0 fetch --locked
      - name: Build and qualify the source and binary artifacts
        run: |
          python evaluations/native_packaging/qualify.py --toolchain 1.96.0 --profile release \
            --target "${{ matrix.target }}" --output "$RUNNER_TEMP/gwt-distribution"
      - name: Generate matching review and standalone example
        run: |
          GWT_DIST_WORKSPACE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["workspace"])' "$RUNNER_TEMP/gwt-distribution/qualification.json")
          python tools/build_site.py --gwt "$GWT_DIST_WORKSPACE/installed/bin/gwt"
          python tools/verify_product.py --gwt "$GWT_DIST_WORKSPACE/installed/bin/gwt" > "$RUNNER_TEMP/gwt-distribution/product.json"
      - uses: actions/upload-artifact@v4
        with:
          name: gwt-preview-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/gwt-distribution/
            docs/demo/
            docs/downloads/
          if-no-files-found: error
# This workflow creates CI artifacts only; tags, registries, releases, and site
# deployment require a separately authorized publication operation.
