name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85.0", "1.96.0"]
        profile: ["dev", "release"]
        target: ["x86_64-unknown-linux-gnu"]
        include:
          - rust: "1.85.0"
            profile: "release"
            target: "x86_64-unknown-linux-musl"
          - rust: "1.96.0"
            profile: "release"
            target: "x86_64-unknown-linux-musl"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt --target "${{ matrix.target }}"
      - name: Configure static musl linking
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          GWT_SYSROOT=$(rustup run "${{ matrix.rust }}" rustc --print sysroot)
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$GWT_SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C link-self-contained=yes -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Test native foundation
        run: rustup run "${{ matrix.rust }}" cargo test --profile "${{ matrix.profile }}" --target "${{ matrix.target }}" --workspace --locked
      - name: Check native code
        if: matrix.profile == 'dev' || matrix.target == 'x86_64-unknown-linux-musl'
        run: rustup run "${{ matrix.rust }}" cargo clippy --profile "${{ matrix.profile }}" --target "${{ matrix.target }}" --workspace --all-targets --locked -- -D warnings
      - name: Check native formatting
        if: matrix.rust == '1.96.0' && matrix.profile == 'dev'
        run: rustup run "${{ matrix.rust }}" cargo fmt --all -- --check
      - name: Set up Python for native package qualification
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualify packaged native library and CLI
        run: |
          python evaluations/native_packaging/qualify.py \
            --toolchain "${{ matrix.rust }}" \
            --profile "${{ matrix.profile }}" \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/gwt-packaging-${{ matrix.rust }}-${{ matrix.profile }}-${{ matrix.target }}"
      - name: Set up Node for native host qualification
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Qualify Node host against the packaged native executable
        run: |
          GWT_PACKAGE_EVIDENCE="$RUNNER_TEMP/gwt-packaging-${{ matrix.rust }}-${{ matrix.profile }}-${{ matrix.target }}"
          GWT_NATIVE_PATH="$(python -c 'import json, pathlib, sys; print(pathlib.Path(json.load(open(sys.argv[1]))["workspace"]) / "installed/bin/gwt")' "$GWT_PACKAGE_EVIDENCE/qualification.json")"
          export GWT_NATIVE_PATH
          GWT_NODE_EVIDENCE="$GWT_PACKAGE_EVIDENCE/node-host" node --test tests/native_node_host.test.mjs

      - name: Exercise native review walkthrough
        if: matrix.rust == '1.96.0' && matrix.profile == 'dev'
        run: |
          python examples/native_review_walkthrough/prepare.py "$RUNNER_TEMP/gwt-delivery-walkthrough" \
            --native "target/${{ matrix.target }}/debug/gwt"

  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install GWT outside the source tree
        run: cargo +1.96.0 install --path crates/gwt-core --locked --root "$RUNNER_TEMP/gwt-install"
      - name: Verify the consumer product and generated site
        run: python tools/verify_product.py --gwt "$RUNNER_TEMP/gwt-install/bin/gwt"
      - name: Check independent research and packaging tools
        run: python -m unittest discover
      - name: Check editor and host integration
        run: |
          npm --prefix vscode-gwt ci
          npm --prefix vscode-gwt run check
          npm --prefix vscode-gwt test
          GWT_NATIVE_PATH="$RUNNER_TEMP/gwt-install/bin/gwt" node --test tests/native_node_host.test.mjs
      - name: Check whitespace
        run: git diff --check
