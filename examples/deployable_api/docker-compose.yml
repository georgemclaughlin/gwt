services:
  gwt-serve:
    build:
      context: ../..
      dockerfile: examples/deployable_api/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GWT_ENGINE: "${GWT_ENGINE:-asgi}"
      GWT_SERVE_ARGS: "${GWT_SERVE_ARGS:-}"
    ports:
      - "${GWT_HTTP_BIND:-127.0.0.1}:${GWT_HTTP_PORT:-8080}:8080"
    depends_on:
      - otel-collector
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${OTLP_HTTP_BIND:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
      - "${OTEL_COLLECTOR_PROMETHEUS_BIND:-127.0.0.1}:${OTEL_COLLECTOR_PROMETHEUS_PORT:-9464}:9464"
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    ports:
      - "${JAEGER_UI_BIND:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
